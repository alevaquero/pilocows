name: Release Backend

on:
  push:
    tags:
      - 'backend-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: pilocows-backend
            asset: pilocows-backend-macos-arm64

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pilocows-backend.exe
            asset: pilocows-backend-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build
        working-directory: backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          mv "backend/target/${{ matrix.target }}/release/${{ matrix.binary }}" \
             "backend/target/${{ matrix.target }}/release/${{ matrix.asset }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: backend/target/${{ matrix.target }}/release/${{ matrix.asset }}
          generate_release_notes: true
