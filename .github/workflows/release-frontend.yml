name: Release Frontend

on:
  push:
    tags:
      - 'frontend-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            tauri_args: ''
            rust_targets: aarch64-apple-darwin

          - name: Windows x86_64
            os: windows-latest
            tauri_args: ''
            rust_targets: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # Cache backend Rust deps separately — only needed on Windows where
      # the backend is compiled and bundled as a sidecar.
      - uses: Swatinem/rust-cache@v2
        if: matrix.os == 'windows-latest'
        with:
          workspaces: backend
          key: backend-${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Build the backend and stage it where Tauri expects the sidecar binary.
      - name: Build backend sidecar
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release
          mkdir -p ../frontend/src-tauri/binaries
          cp target/release/pilocows-backend.exe \
             ../frontend/src-tauri/binaries/pilocows-backend-${{ matrix.rust_targets }}.exe
        working-directory: backend

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: frontend-v__VERSION__
          releaseName: Frontend v__VERSION__
          releaseBody: |
            Pilocows desktop app — Tauri + React.

            **macOS**: open the `.dmg`, drag to Applications.
            **Windows**: run the `.msi` installer or the `.exe` setup.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}
