name: Release Frontend

on:
  push:
    tags:
      - 'frontend-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            tauri_args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

          - name: Windows x86_64
            os: windows-latest
            tauri_args: ''
            rust_targets: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: frontend-v__VERSION__
          releaseName: Frontend v__VERSION__
          releaseBody: |
            Pilocows desktop app — Tauri + React.

            **macOS**: open the `.dmg`, drag to Applications.
            **Windows**: run the `.msi` installer or the `.exe` setup.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}
