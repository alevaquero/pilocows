[env:sc01plus]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; Flash & PSRAM — WT32-S3-WROVER-2-N8R2: 8MB Flash, 2MB OPI PSRAM
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; CPU speed
board_build.f_cpu = 240000000L

; Custom partition table
board_build.partitions = partitions.csv

; Upload via ESP32-S3 native USB Serial/JTAG
upload_protocol = esptool
upload_port = /dev/cu.usbmodem101
upload_speed = 921600
; Custom upload command — mirrors the working manual esptool invocation.
; OTA layout: bootloader@0x0, partitions@0x8000, otadata@0xF000, firmware@0x20000 (ota_0).
; ota_data_initial.bin resets otadata to point at ota_0, so USB uploads always win over
; any previous OTA update that had switched the boot slot to ota_1.
upload_command = python3 ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 --port $UPLOAD_PORT --baud $UPLOAD_SPEED --before default_reset --after no_reset write_flash --flash_mode keep --flash_freq keep --flash_size keep --compress 0x0 $BUILD_DIR/bootloader.bin 0x8000 $BUILD_DIR/partitions.bin 0xF000 $BUILD_DIR/ota_data_initial.bin 0x20000 $BUILD_DIR/firmware.bin

; Monitor — USB Serial/JTAG console (CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y)
monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    default

; Build flags
build_flags =
    -DBOARD_SC01_PLUS
    -DCONFIG_LV_COLOR_DEPTH=16
    -DLVGL_CONF_INCLUDE_SIMPLE
    -Wno-unused-variable
    -Wno-unused-but-set-variable

